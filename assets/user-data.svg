<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="A saved game file from your device">
  <defs>
    <linearGradient id="ud-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b16"/>
      <stop offset=".55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#151233"/>
    </linearGradient>
    <radialGradient id="ud-glow" cx=".5" cy=".44" r=".62">
      <stop stop-color="#59f3ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ud-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a2450"/>
      <stop offset=".5" stop-color="#111a38"/>
      <stop offset="1" stop-color="#1d1740"/>
    </linearGradient>
    <linearGradient id="ud-edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#59f3ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ud-bg)"/>
  <ellipse cx="400" cy="240" rx="360" ry="250" fill="url(#ud-glow)"/>

  <g fill="none" stroke="#9bdcff" stroke-opacity=".08">
    <path d="M0 420 800 80M0 470 800 130M0 370 800 30"/>
    <path d="M150 0v500M300 0v500M500 0v500M650 0v500"/>
  </g>

  <!-- saved-file card -->
  <g transform="translate(250 118)">
    <rect x="0" y="10" width="300" height="230" rx="18" fill="#050810" opacity=".8"/>
    <rect x="0" y="0" width="300" height="230" rx="18" fill="url(#ud-card)" stroke="#6f83c8" stroke-opacity=".45" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="6" rx="3" fill="url(#ud-edge)" opacity=".9"/>

    <!-- file glyph -->
    <g transform="translate(104 46)">
      <path d="M0 8a8 8 0 0 1 8-8h34l18 18v78a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#0b1430" stroke="#59f3ff" stroke-opacity=".55" stroke-width="2"/>
      <path d="M42 0v20h20" fill="none" stroke="#59f3ff" stroke-opacity=".55" stroke-width="2"/>
      <path d="M24 52 46 66 24 80z" fill="#9b8cff"/>
      <path d="M18 92h56" stroke="#59f3ff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="150" y="186" fill="#d9eaff" font-family="monospace" font-size="14" letter-spacing="5" text-anchor="middle">YOUR DATA</text>
    <text x="150" y="206" fill="#7f96c9" font-family="monospace" font-size="9" letter-spacing="3" text-anchor="middle">SAVED IN THIS BROWSER</text>
  </g>

  <text x="400" y="431" fill="#d9eaff" font-family="monospace" font-size="18" letter-spacing="8" text-anchor="middle">YOUR DATA // ARCADE</text>
  <text x="400" y="456" fill="#8b7fc7" font-family="monospace" font-size="11" letter-spacing="5" text-anchor="middle">LOCAL FILES, REMEMBERED</text>
</svg>
