<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="A Game Boy Advance with a glowing screen">
  <defs>
    <linearGradient id="gba-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090d1d"/>
      <stop offset=".55" stop-color="#14132c"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="gba-shell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4b3f86"/>
      <stop offset=".5" stop-color="#33285f"/>
      <stop offset="1" stop-color="#1e173d"/>
    </linearGradient>
    <linearGradient id="gba-screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1830"/>
      <stop offset=".5" stop-color="#123c55"/>
      <stop offset="1" stop-color="#0d1d38"/>
    </linearGradient>
    <radialGradient id="gba-glow" cx=".5" cy=".45" r=".62">
      <stop stop-color="#59f3ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gba-beam" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#59f3ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gba-bg)"/>
  <ellipse cx="400" cy="250" rx="350" ry="240" fill="url(#gba-glow)"/>

  <g fill="none" stroke="#9bdcff" stroke-opacity=".1">
    <path d="M0 410 800 90M0 462 800 142M0 358 800 38"/>
    <path d="M150 0v500M300 0v500M500 0v500M650 0v500"/>
  </g>

  <!-- handheld body -->
  <g transform="translate(156 84)">
    <rect x="0" y="16" width="488" height="304" rx="46" fill="#120d24" opacity=".8"/>
    <rect x="0" y="0" width="488" height="304" rx="46" fill="url(#gba-shell)" stroke="#7768c8" stroke-opacity=".5" stroke-width="2"/>
    <rect x="34" y="28" width="420" height="248" rx="18" fill="#0c0a19" stroke="#17132e" stroke-width="3"/>

    <!-- screen bezel -->
    <rect x="78" y="52" width="332" height="200" rx="9" fill="#090c16"/>
    <rect x="92" y="66" width="304" height="172" rx="4" fill="url(#gba-screen)"/>
    <rect x="92" y="66" width="304" height="172" rx="4" fill="url(#gba-glow)"/>

    <!-- screen art: a tiny platformer scene -->
    <g opacity=".9">
      <rect x="92" y="196" width="304" height="42" fill="#0c2038"/>
      <path d="M92 196h304v10H92z" fill="#2e6f8c" opacity=".7"/>
      <path d="M112 186h48v10h-48zM196 168h64v10h-64zM292 180h44v10h-44zM352 152h28v10h-28z" fill="#59f3ff" opacity=".8"/>
      <path d="M132 166h22v20h-22z" fill="#9b8cff"/>
      <path d="M132 162h22v6h-22z" fill="#d9d2ff"/>
      <circle cx="139" cy="158" r="8" fill="#ffd166"/>
      <path d="M120 186h12v10h-12zM150 186h12v10h-12z" fill="#ffd166"/>
      <path d="M330 132l10 14h-20z" fill="#7cf7c4"/>
      <path d="M368 118l12 16h-24z" fill="#7cf7c4" opacity=".8"/>
      <circle cx="270" cy="96" r="14" fill="#ff9ecf" opacity=".55"/>
      <circle cx="250" cy="92" r="4" fill="#fff" opacity=".6"/>
    </g>
    <g opacity=".18" stroke="#bff7ff" stroke-width="1">
      <path d="M96 80h296M96 96h296M96 112h296M96 128h296M96 144h296M96 160h296M96 176h296M96 192h296M96 208h296M96 224h296"/>
    </g>
    <text x="244" y="255" fill="#8fd8e8" opacity=".7" font-family="monospace" font-size="9" letter-spacing="4" text-anchor="middle">mGBA · WASM</text>

    <!-- d-pad -->
    <g transform="translate(50 158)" fill="#211a3d" stroke="#6f61b8" stroke-opacity=".55" stroke-width="2">
      <path d="M20 0h20v20h20v20H60v20H40V60H20V40H0V20h20z"/>
    </g>
    <circle cx="70" cy="198" r="4" fill="#9b8cff" opacity=".55"/>

    <!-- face buttons -->
    <g transform="translate(384 156)">
      <circle cx="22" cy="22" r="21" fill="#1d1638" stroke="#9b8cff" stroke-opacity=".6" stroke-width="2"/>
      <circle cx="22" cy="22" r="13" fill="#2c2254"/>
      <text x="22" y="27" fill="#e8e2ff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">B</text>
      <circle cx="70" cy="0" r="21" fill="#1d1638" stroke="#59f3ff" stroke-opacity=".7" stroke-width="2"/>
      <circle cx="70" cy="0" r="13" fill="#1d4650"/>
      <text x="70" y="5" fill="#d9ffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">A</text>
    </g>

    <!-- shoulders -->
    <rect x="40" y="-12" width="88" height="18" rx="9" fill="#2b2352" stroke="#7768c8" stroke-opacity=".45"/>
    <rect x="360" y="-12" width="88" height="18" rx="9" fill="#2b2352" stroke="#7768c8" stroke-opacity=".45"/>

    <!-- start / select -->
    <g transform="translate(214 274)" fill="#7768c8" opacity=".8">
      <rect x="0" y="0" width="24" height="7" rx="3.5"/>
      <rect x="38" y="0" width="24" height="7" rx="3.5"/>
    </g>

    <!-- speaker -->
    <g transform="translate(404 272)" fill="#120d24" opacity=".7">
      <circle cx="0" cy="0" r="3"/><circle cx="10" cy="0" r="3"/><circle cx="20" cy="0" r="3"/>
      <circle cx="0" cy="9" r="3"/><circle cx="10" cy="9" r="3"/><circle cx="20" cy="9" r="3"/>
    </g>
  </g>

  <path d="M400 28v18M391 37h18" stroke="url(#gba-beam)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <text x="400" y="431" fill="#d9eaff" font-family="monospace" font-size="18" letter-spacing="8" text-anchor="middle">GAME BOY // ADVANCE</text>
  <text x="400" y="456" fill="#8b7fc7" font-family="monospace" font-size="11" letter-spacing="5" text-anchor="middle">BRING YOUR OWN ROM</text>
</svg>
